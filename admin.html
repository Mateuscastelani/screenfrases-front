<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - ScreenMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="admin-container">
        <header class="admin-header">
            <div>
                <h1>Painel de Administração</h1>
                <p class="admin-subtitulo">Gerencie as frases clássicas do ScreenFrases</p>
            </div>
            <a href="index.html" class="btn-voltar">← Voltar ao site</a>
        </header>

        <section class="form-card">
            <h2>Adicionar Nova Frase</h2>
            <form id="form-frase" class="admin-form">
                <input type="text" id="titulo" placeholder="Título da Série/Filme" required>
                <input type="text" id="frase" placeholder="A Frase Clássica" required>
                <input type="text" id="personagem" placeholder="Personagem" required>
                <input type="url" id="poster" placeholder="Link da Imagem (Poster)" required>
                <button type="submit" class="btn-salvar">Salvar Frase</button>
            </form>
        </section>

        <section class="tabela-section">
            <h2>Frases Cadastradas</h2>
            <div class="tabela-wrapper">
                <table class="tabela-frases">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Personagem</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        <!-- Preenchido pelo admin.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="./scripts/admin.js"></script>
</body>
</html>
